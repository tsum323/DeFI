# Tokens and pools under research.
# Pool addresses are DERIVED deterministically (CREATE2: factory + token0 +
# token1 + fee + init code hash) and re-checked by tests/test_config.py.
# On-chain existence and creation block must be confirmed in stage 2
# (Factory.getPool / PoolCreated event) — status field tracks that.

tokens:
  ethereum:
    WBTC:
      address: "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599"
      decimals: 8
      wrapped_asset: BTC
      # WBTC is an IOU for BTC held by a custodian. It is NOT native Bitcoin.
      risk_notes:
        - custodial wrapper; peg to BTC depends on custodian/merchant redemption
        - custody arrangement changed in 2024 (BitGo -> joint custody incl. BiT Global)
        - all valuations use WBTC pool price in USDC, never a BTC index price
    USDC:
      address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
      decimals: 6
      risk_notes:
        - fiat-backed stablecoin; treated as 1 USD only with an explicit assumption flag
        - "depeg precedent: March 2023 (SVB)"
    WETH:
      address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
      decimals: 18

