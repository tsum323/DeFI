# Global lab settings.

mode: research_only        # the ONLY supported mode. No trading, no wallets.

database:
  url: sqlite:///data/lab.sqlite   # PostgreSQL later: postgresql+psycopg://...

data_engine:
  logs_chunk_blocks: 5000          # initial eth_getLogs window, adaptively halved on errors
  min_chunk_blocks: 50
  confirmations: 64                # ~2 epochs: do not ingest unfinalized blocks
  max_retries: 5
  retry_backoff_seconds: [2, 4, 8, 16, 32]

costs:
  # MODELED: medians of gasUsed from 860 real receipts of wbtc_usdc_3000 txs, 2021-2026
  # (scripts.calibrate_gas, 2026-11-01; data_snapshots/wbtc_usdc_3000/gas_calibration.json).
  # Stable across years (yearly medians within ~10%). Was: 500k / 200k / 250k / 180k assumptions.
  gas_units:
    mint_new_position: 436000               # n=292, p25-p75 402k-446k, p90 488k
    increase_liquidity: 200000              # n=97,  p25-p75 189k-238k, p90 245k
    decrease_liquidity_and_collect: 200000  # n=260, p25-p75 183k-215k, p90 222k
    swap_for_rebalance: 127000              # n=211 plain single-hop router swaps, p90 155k
  gas_units_p90:                            # conservative set for sensitivity tests
    mint_new_position: 488000
    increase_liquidity: 245000
    decrease_liquidity_and_collect: 222000
    swap_for_rebalance: 155000
  gas_price_source: block_base_fee_plus_priority   # historical baseFeePerGas per block
  priority_fee_gwei: 1.0

ai_researcher:
  provider: anthropic
  model: claude-opus-5-5           # swappable via adapter
  api_key_env: ANTHROPIC_API_KEY
  max_hypotheses_per_cycle: 5

signal_engine:
  validity_days: 7                 # a signal expires after this
  max_data_age_minutes: 90         # older market data -> WAIT ("data not current")
  min_volume_24h_usd: 100000       # pool activity filter
  min_oos_positive_segments: 5     # of 7: excess over the passive LP > 0
  require_positive_oos_roi: true   # mean absolute OOS ROI must be > 0 (SPEC 11.4)
  max_mean_drawdown: 0.30
  capital_usd: 10000
  fee_lookback_days: [7, 30]       # fee estimate range from these windows
  price_scenarios: [-0.20, -0.10, -0.05, 0.0, 0.05, 0.10, 0.20]

scheduler:
  max_parallel_heavy_jobs: 1        # heavy jobs never run concurrently (lock in the DB)
  tick_seconds: 60
  # SPEC 16 cycle: load data -> check -> market analysis -> strategies -> experiments ->
  # optimization -> ranking -> hypotheses -> signals -> virtual positions -> save -> report
  jobs:
    sync:            {every_minutes: 15,    heavy: false, cmd: ["scripts.sync_pool", "--endpoint", "drpc", "--max-minutes", "10"]}
    check_sources:   {every_minutes: 360,   heavy: false, cmd: ["scripts.check_data_sources"]}
    evaluate_market: {every_minutes: 60,    heavy: false, cmd: ["scripts.evaluate_market"], after: ["sync"]}
    forward_tests:   {every_minutes: 60,    heavy: false, cmd: ["scripts.forward_test"], after: ["sync"]}
    # heavy research: checked weekly, but runs only if the stored study is outdated
    # (result code changed or a new 91-day segment is complete); otherwise it is reused
    validation:      {every_minutes: 10080, heavy: true,  only_if: study_outdated, cmd: ["scripts.run_validation"]}
    optimization:    {every_minutes: 10080, heavy: true,  only_if: study_outdated, cmd: ["scripts.run_optuna", "--trials", "240"]}
    research:        {every_minutes: 1440,  heavy: true,  cmd: ["scripts.run_research"], needs_env: ANTHROPIC_API_KEY}
    report:          {every_minutes: 1440,  heavy: false, cmd: ["scripts.report"]}
    save_snapshot:   {every_minutes: 1440,  heavy: false, cmd: ["scripts.data_snapshot", "export-research"]}

# UNISWAP AI LAB: market scanner (backend/lab/scanner.py)
scanner:
  pools: [wbtc_usdc_3000, wbtc_usdc_500, weth_usdc_100, weth_usdc_500, weth_usdc_3000,
          wbtc_weth_100, wbtc_weth_500, wbtc_weth_3000,
          base_weth_usdc_500, base_weth_usdc_3000, base_cbbtc_usdc_500, base_cbbtc_usdc_3000, base_cbbtc_weth_500,
          arb_weth_usdc_500, arb_weth_usdc_3000, arb_wbtc_usdc_500, arb_wbtc_weth_500,
          op_weth_usdc_500, op_weth_usdc_3000]
  backfill_days: 30          # first run only (Ethereum); afterwards only new blocks
  endpoint: drpc             # Ethereum: archive, free; 100-block eth_getLogs windows, batches of 3
  networks:                  # per network: preferred endpoint, first log window, backfill depth
    ethereum: {endpoint: drpc, step: 100, batch: 3, backfill_days: 30}
    base: {endpoint: publicnode, step: 2000, batch: 1, backfill_days: 14}
    optimism: {endpoint: publicnode, step: 2000, batch: 1, backfill_days: 14}
    arbitrum: {endpoint: drpc, step: 5000, batch: 1, backfill_days: 14}

# UNISWAP AI LAB: virtual portfolio (backend/lab/portfolio.py). Change the capital here
# (on GitHub: open this file, pencil icon, edit, "Commit changes") — the next update uses it.
portfolio:
  virtual_capital_usd: 10000
  allocation: {CONSERVATIVE: 0.30, MODERATE: 0.15, EXPERIMENTAL: 0.05}   # of the capital
  max_open: 8
  max_days: 30                      # a virtual position is closed and evaluated after this
  close_after_hours_out_of_ranking: 72

# UNISWAP AI LAB: "my bot" — a virtual twin of the user with its own small capital
# (backend/lab/bot.py). It holds one position at a time and reinvests the result.
bot:
  start_usd: 100
  min_hold_days: 3            # no switching before this (unless the price left the range)
  switch_margin: 0.25         # a new option must beat the current one by 25% after switching costs
  out_of_range_hours: 24      # out of range this long -> re-centre or move
  max_exit_probability: 0.5   # never pick a range the price will likely leave within a week

